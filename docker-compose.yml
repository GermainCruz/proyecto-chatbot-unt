services:
  db:
    image: pgvector/pgvector:pg16
    container_name: untbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-untbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-untbot}
      POSTGRES_DB: ${POSTGRES_DB:-untbot}
    ports:
      # Puerto en el host configurable (por defecto 5434). Si 5433 está ocupado por otro contenedor, usa POSTGRES_HOST_PORT en .env
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - untbot_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-untbot} -d ${POSTGRES_DB:-untbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: untbot_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-untbot}:${POSTGRES_PASSWORD:-untbot}@db:5432/${POSTGRES_DB:-untbot}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-gemini-2.0-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      ALLOWED_EMAIL_DOMAIN: unitru.edu.pe
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@unitru.edu.pe}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234*}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador UNT Bot}
      STORAGE_DIR: /app/documentos
    volumes:
      - ./documentos:/app/documentos
      - ./backend/app:/app/app
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: untbot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  untbot_pgdata:
